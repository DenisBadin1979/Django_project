{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Магазин</title>
    <!-- Подключите статичеcкие файлы со стилями Bootstrap -->
     <link href="{% static 'css/bootstrap.min.css'%} " rel="stylesheet">
    
</head>
<body>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Магазин</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="/">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
        <a class="p-2 btn btn-outline-primary" href="/blog/">Блог</a>
        {% if user.is_authenticated %}
            {% csrf_token %}
	    <a class="p-2 btn btn-outline-primary" href="{% url 'logout' %}">Выйти</a>

        <p style="font-size: 34px; color: green;">***Добро пожаловать {{ user.username }}</p>
        {% else %}
            <p style="font-size: 34px; color: green;">***Добро пожаловать на сайт</p>
            <a class="p-2 btn btn-outline-primary" href="{% url 'login' %}">Войти</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
{% block content %}
{% endblock %}
<!-- Подключите статичеcкие файлы со скриптами Bootstrap -->
</body>
</html>
